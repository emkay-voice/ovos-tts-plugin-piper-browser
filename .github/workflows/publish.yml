# Build the wheel on every push; publish it to PyPI when a version tag is
# pushed (vX.Y.Z, matching `version` in pyproject.toml). Publishing uses PyPI's
# trusted publishing (no token): the PyPI project must name this repo, this
# workflow and the "pypi" environment as its publisher.
name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install -q build
          python -m build
      - name: Pure Python, entry point present
        run: |
          ls dist
          ls dist/*-py3-none-any.whl
          unzip -p dist/*.whl '*.dist-info/entry_points.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
